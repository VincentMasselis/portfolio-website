server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # .mjs files are ES modules used by Skiko — browsers reject them without the correct MIME type
    types {
        application/javascript mjs;
    }

    # Wasm and JS assets are large; gzip cuts transfer size significantly
    gzip on;
    gzip_types application/javascript application/wasm;
}
